<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos - Gestión Licorería</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
    :root {
      --color-primario: #4a1e2b;
      --color-secundario: #7a2c3e;
      --color-acento: #d4a24c;
      --bg-suave: #f7f4f1;
    }
    body { background-color: var(--bg-suave); font-family: 'Segoe UI', system-ui, sans-serif; }
    .app-navbar { background-color: var(--color-primario); }
    .sidebar { min-height: calc(100vh - 56px); background-color: #fff; border-right: 1px solid #e5e0dc; }
    .sidebar .nav-link { text-align: left; padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; color: #4a4a4a; font-weight: 500; text-decoration: none; }
    .sidebar .nav-link i { width: 22px; }
    .sidebar .nav-link:hover { background-color: var(--bg-suave); }
    .sidebar .nav-link.active { background-color: var(--color-primario); color: #fff; }
    .table thead { background-color: var(--bg-suave); }
</style>
</head>
<body>

<nav class="navbar navbar-dark app-navbar">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fa-solid fa-wine-bottle"></i> Gestión Licorería</span>
    <span id="fecha-actual" class="text-white small"></span>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 sidebar d-flex flex-column p-3">
      <a class="nav-link" href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      <a class="nav-link active" href="productos.html"><i class="fa-solid fa-boxes-stacked"></i> Productos</a>
      <a class="nav-link" href="ventas.html"><i class="fa-solid fa-cash-register"></i> Ventas</a>
      <a class="nav-link" href="inventario.html"><i class="fa-solid fa-truck-ramp-box"></i> Inventario</a>
      <a class="nav-link" href="reportes.html"><i class="fa-solid fa-file-invoice-dollar"></i> Reportes</a>
    </nav>

    <main class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Productos</h3>
        <button class="btn btn-primary" onclick="abrirModalProducto()"><i class="fa-solid fa-plus"></i> Nuevo producto</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>Nombre</th><th>Categoría</th><th>Precio compra</th><th>Precio venta</th>
              <th>Stock</th><th>Stock mín.</th><th>Proveedor</th><th></th>
            </tr>
          </thead>
          <tbody id="tabla-productos"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Modal producto -->
<div class="modal fade" id="modalProducto" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="form-producto">
        <div class="modal-header">
          <h5 class="modal-title">Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="producto-id">
          <div class="mb-2">
            <label class="form-label">Nombre</label>
            <input class="form-control" id="producto-nombre" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Categoría</label>
            <input class="form-control" id="producto-categoria" placeholder="Ej: Whisky, Cerveza, Vino...">
          </div>
          <div class="row">
            <div class="col-6 mb-2">
              <label class="form-label">Precio de compra</label>
              <input type="number" step="0.01" min="0" class="form-control" id="producto-precio-compra" required>
            </div>
            <div class="col-6 mb-2">
              <label class="form-label">Precio de venta</label>
              <input type="number" step="0.01" min="0" class="form-control" id="producto-precio-venta" required>
            </div>
          </div>
          <div class="row">
            <div class="col-6 mb-2">
              <label class="form-label">Stock actual</label>
              <input type="number" min="0" class="form-control" id="producto-stock" required>
            </div>
            <div class="col-6 mb-2">
              <label class="form-label">Stock mínimo</label>
              <input type="number" min="0" class="form-control" id="producto-stock-minimo" value="0">
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">Proveedor</label>
            <input class="form-control" id="producto-proveedor">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toast-container" class="position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = "/api";
    let productosCache = [];

    document.addEventListener("DOMContentLoaded", () => {
      const fechaEl = document.getElementById("fecha-actual");
      if (fechaEl) {
        fechaEl.textContent = new Date().toLocaleDateString("es-EC", { year: "numeric", month: "long", day: "numeric" });
      }
      cargarProductos();
      document.getElementById("form-producto").addEventListener("submit", guardarProducto);
    });

    async function apiFetch(path, options = {}) {
      const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...options });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "Error desconocido");
      return json.data;
    }

    function money(valor) { return "$" + Number(valor || 0).toFixed(2); }

    function mostrarToast(mensaje, tipo = "success") {
      const contenedor = document.getElementById("toast-container");
      if (!contenedor) return;
      const id = "t" + Date.now();
      const html = `
        <div id="${id}" class="toast align-items-center text-white bg-${tipo === "success" ? "success" : "danger"} border-0" role="alert">
          <div class="d-flex">
            <div class="toast-body">${mensaje}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>`;
      contenedor.insertAdjacentHTML("beforeend", html);
      new bootstrap.Toast(document.getElementById(id), { delay: 3500 }).show();
    }

    async function cargarProductos() {
      try {
        productosCache = await apiFetch("/productos");
        document.getElementById("tabla-productos").innerHTML = productosCache.map(p => `
          <tr>
            <td>${p.Nombre}</td>
            <td>${p.Categoria || ""}</td>
            <td>${money(p.Precio_Compra)}</td>
            <td>${money(p.Precio_Venta)}</td>
            <td>${p.Stock_Actual}</td>
            <td>${p.Stock_Minimo}</td>
            <td>${p.Proveedor || ""}</td>
            <td>
              <button class="btn btn-sm btn-outline-secondary" onclick='abrirModalProducto(${JSON.stringify(p)})'><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="eliminarProducto('${p.ID}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`).join("");
      } catch (e) {
        mostrarToast("Error al cargar productos: " + e.message, "error");
      }
    }

    function abrirModalProducto(producto = null) {
      document.getElementById("form-producto").reset();
      document.getElementById("producto-id").value = producto ? producto.ID : "";
      document.getElementById("producto-nombre").value = producto ? producto.Nombre : "";
      document.getElementById("producto-categoria").value = producto ? producto.Categoria : "";
      document.getElementById("producto-precio-compra").value = producto ? producto.Precio_Compra : "";
      document.getElementById("producto-precio-venta").value = producto ? producto.Precio_Venta : "";
      document.getElementById("producto-stock").value = producto ? producto.Stock_Actual : 0;
      document.getElementById("producto-stock-minimo").value = producto ? producto.Stock_Minimo : 0;
      document.getElementById("producto-proveedor").value = producto ? producto.Proveedor : "";
      new bootstrap.Modal(document.getElementById("modalProducto")).show();
    }

    async function guardarProducto(ev) {
      ev.preventDefault();
      const id = document.getElementById("producto-id").value;
      const data = {
        Nombre: document.getElementById("producto-nombre").value,
        Categoria: document.getElementById("producto-categoria").value,
        Precio_Compra: parseFloat(document.getElementById("producto-precio-compra").value),
        Precio_Venta: parseFloat(document.getElementById("producto-precio-venta").value),
        Stock_Actual: parseInt(document.getElementById("producto-stock").value),
        Stock_Minimo: parseInt(document.getElementById("producto-stock-minimo").value || 0),
        Proveedor: document.getElementById("producto-proveedor").value,
      };
      try {
        if (id) {
          await apiFetch(`/productos/${id}`, { method: "PUT", body: JSON.stringify(data) });
          mostrarToast("Producto actualizado");
        } else {
          await apiFetch("/productos", { method: "POST", body: JSON.stringify(data) });
          mostrarToast("Producto creado");
        }
        bootstrap.Modal.getInstance(document.getElementById("modalProducto")).hide();
        cargarProductos();
      } catch (e) {
        mostrarToast("Error al guardar: " + e.message, "error");
      }
    }

    async function eliminarProducto(id) {
      if (!confirm("¿Eliminar este producto? Esta acción no se puede deshacer.")) return;
      try {
        await apiFetch(`/productos/${id}`, { method: "DELETE" });
        mostrarToast("Producto eliminado");
        cargarProductos();
      } catch (e) {
        mostrarToast("Error al eliminar: " + e.message, "error");
      }
    }
</script>
</body>
</html>
