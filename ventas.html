<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas - Gestión Licorería</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
    :root {
      --color-primario: #4a1e2b;
      --color-secundario: #7a2c3e;
      --color-acento: #d4a24c;
      --bg-suave: #f7f4f1;
    }
    body { background-color: var(--bg-suave); font-family: 'Segoe UI', system-ui, sans-serif; }
    .app-navbar { background-color: var(--color-primario); }
    .sidebar { min-height: calc(100vh - 56px); background-color: #fff; border-right: 1px solid #e5e0dc; }
    .sidebar .nav-link { text-align: left; padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; color: #4a4a4a; font-weight: 500; text-decoration: none; }
    .sidebar .nav-link i { width: 22px; }
    .sidebar .nav-link:hover { background-color: var(--bg-suave); }
    .sidebar .nav-link.active { background-color: var(--color-primario); color: #fff; }
    .table thead { background-color: var(--bg-suave); }
</style>
</head>
<body>

<nav class="navbar navbar-dark app-navbar">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fa-solid fa-wine-bottle"></i> Gestión Licorería</span>
    <span id="fecha-actual" class="text-white small"></span>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 sidebar d-flex flex-column p-3">
      <a class="nav-link" href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      <a class="nav-link" href="productos.html"><i class="fa-solid fa-boxes-stacked"></i> Productos</a>
      <a class="nav-link active" href="ventas.html"><i class="fa-solid fa-cash-register"></i> Ventas</a>
      <a class="nav-link" href="inventario.html"><i class="fa-solid fa-truck-ramp-box"></i> Inventario</a>
      <a class="nav-link" href="reportes.html"><i class="fa-solid fa-file-invoice-dollar"></i> Reportes</a>
    </nav>

    <main class="col-md-10 p-4">
      <h3 class="mb-3">Registrar venta</h3>
      <div class="card p-3 mb-4">
        <form id="form-venta" class="row g-3">
          <div class="col-md-5">
            <label class="form-label">Producto</label>
            <select class="form-select" id="venta-producto" required></select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Cantidad</label>
            <input type="number" min="1" class="form-control" id="venta-cantidad" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Método de pago</label>
            <select class="form-select" id="venta-metodo">
              <option>Efectivo</option>
              <option>Tarjeta</option>
              <option>Transferencia</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-success w-100" type="submit"><i class="fa-solid fa-check"></i> Vender</button>
          </div>
        </form>
      </div>

      <h5>Historial de ventas</h5>
      <div class="table-responsive">
        <table class="table table-sm table-striped">
          <thead><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>P. Unitario</th><th>Total</th><th>Pago</th></tr></thead>
          <tbody id="tabla-ventas"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div id="toast-container" class="position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = "/api";

    document.addEventListener("DOMContentLoaded", async () => {
      const fechaEl = document.getElementById("fecha-actual");
      if (fechaEl) {
        fechaEl.textContent = new Date().toLocaleDateString("es-EC", { year: "numeric", month: "long", day: "numeric" });
      }
      await cargarSelectProductos();
      cargarVentas();
      document.getElementById("form-venta").addEventListener("submit", registrarVenta);
    });

    async function apiFetch(path, options = {}) {
      const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...options });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "Error desconocido");
      return json.data;
    }

    function money(valor) { return "$" + Number(valor || 0).toFixed(2); }

    function mostrarToast(mensaje, tipo = "success") {
      const contenedor = document.getElementById("toast-container");
      if (!contenedor) return;
      const id = "t" + Date.now();
      const html = `
        <div id="${id}" class="toast align-items-center text-white bg-${tipo === "success" ? "success" : "danger"} border-0" role="alert">
          <div class="d-flex">
            <div class="toast-body">${mensaje}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>`;
      contenedor.insertAdjacentHTML("beforeend", html);
      new bootstrap.Toast(document.getElementById(id), { delay: 3500 }).show();
    }

    async function cargarSelectProductos() {
      try {
        const productos = await apiFetch("/productos");
        document.getElementById("venta-producto").innerHTML = productos
          .map(p => `<option value="${p.ID}">${p.Nombre} (stock: ${p.Stock_Actual})</option>`)
          .join("");
      } catch (e) {
        mostrarToast("Error al cargar productos: " + e.message, "error");
      }
    }

    async function cargarVentas() {
      try {
        const ventas = await apiFetch("/ventas");
        ventas.sort((a, b) => (a.Fecha < b.Fecha ? 1 : -1));
        document.getElementById("tabla-ventas").innerHTML = ventas.map(v => `
          <tr>
            <td>${v.Fecha}</td>
            <td>${v.Producto}</td>
            <td>${v.Cantidad}</td>
            <td>${money(v.Precio_Unitario)}</td>
            <td>${money(v.Total)}</td>
            <td>${v.Metodo_Pago}</td>
          </tr>`).join("");
      } catch (e) {
        mostrarToast("Error al cargar ventas: " + e.message, "error");
      }
    }

    async function registrarVenta(ev) {
      ev.preventDefault();
      const data = {
        ID_Producto: document.getElementById("venta-producto").value,
        Cantidad: parseInt(document.getElementById("venta-cantidad").value),
        Metodo_Pago: document.getElementById("venta-metodo").value,
      };
      try {
        await apiFetch("/ventas", { method: "POST", body: JSON.stringify(data) });
        mostrarToast("Venta registrada correctamente");
        document.getElementById("form-venta").reset();
        await cargarSelectProductos();
        cargarVentas();
      } catch (e) {
        mostrarToast("Error al registrar venta: " + e.message, "error");
      }
    }
</script>
</body>
</html>
