<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Gestión Licorería</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
    :root {
      --color-primario: #4a1e2b;
      --color-secundario: #7a2c3e;
      --color-acento: #d4a24c;
      --bg-suave: #f7f4f1;
    }
    body { background-color: var(--bg-suave); font-family: 'Segoe UI', system-ui, sans-serif; }
    .app-navbar { background-color: var(--color-primario); }
    .sidebar { min-height: calc(100vh - 56px); background-color: #fff; border-right: 1px solid #e5e0dc; }
    .sidebar .nav-link { text-align: left; padding: 10px 14px; border-radius: 8px; margin-bottom: 6px; color: #4a4a4a; font-weight: 500; text-decoration: none; }
    .sidebar .nav-link i { width: 22px; }
    .sidebar .nav-link:hover { background-color: var(--bg-suave); }
    .sidebar .nav-link.active { background-color: var(--color-primario); color: #fff; }
    .card-metric { border: none; border-radius: 12px; padding: 18px; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card-metric h6 { opacity: 0.85; margin-bottom: 6px; font-size: 0.85rem; }
    .card-metric .valor { font-size: 1.6rem; font-weight: 700; }
    .bg-vino { background-color: var(--color-primario); }
    .bg-dorado { background-color: var(--color-acento); color: #3a2a10 !important; }
    .bg-verde { background-color: #2e7d55; }
    .bg-rojo { background-color: #b6412e; }
    .table thead { background-color: var(--bg-suave); }
    .badge-stock-bajo { background-color: #b6412e; }
</style>
</head>
<body>

<nav class="navbar navbar-dark app-navbar">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="fa-solid fa-wine-bottle"></i> Gestión Licorería</span>
    <span id="fecha-actual" class="text-white small"></span>
  </div>
</nav>

<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 sidebar d-flex flex-column p-3">
      <a class="nav-link active" href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      <a class="nav-link" href="productos.html"><i class="fa-solid fa-boxes-stacked"></i> Productos</a>
      <a class="nav-link" href="ventas.html"><i class="fa-solid fa-cash-register"></i> Ventas</a>
      <a class="nav-link" href="inventario.html"><i class="fa-solid fa-truck-ramp-box"></i> Inventario</a>
      <a class="nav-link" href="reportes.html"><i class="fa-solid fa-file-invoice-dollar"></i> Reportes</a>
    </nav>

    <main class="col-md-10 p-4">
      <h3 class="mb-4">Resumen general</h3>
      <div class="row g-3" id="dashboard-cards"></div>

      <h5 class="mt-4">Productos con stock bajo</h5>
      <div class="table-responsive">
        <table class="table table-sm table-striped">
          <thead><tr><th>Producto</th><th>Stock actual</th><th>Stock mínimo</th></tr></thead>
          <tbody id="tabla-stock-bajo"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div id="toast-container" class="position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = "/api";

    document.addEventListener("DOMContentLoaded", () => {
      const fechaEl = document.getElementById("fecha-actual");
      if (fechaEl) {
        fechaEl.textContent = new Date().toLocaleDateString("es-EC", { year: "numeric", month: "long", day: "numeric" });
      }
      cargarDashboard();
    });

    async function apiFetch(path, options = {}) {
      const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...options });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "Error desconocido");
      return json.data;
    }

    function money(valor) { return "$" + Number(valor || 0).toFixed(2); }

    function mostrarToast(mensaje, tipo = "success") {
      const contenedor = document.getElementById("toast-container");
      if (!contenedor) return;
      const id = "t" + Date.now();
      const html = `
        <div id="${id}" class="toast align-items-center text-white bg-${tipo === "success" ? "success" : "danger"} border-0" role="alert">
          <div class="d-flex">
            <div class="toast-body">${mensaje}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>`;
      contenedor.insertAdjacentHTML("beforeend", html);
      new bootstrap.Toast(document.getElementById(id), { delay: 3500 }).show();
    }

    async function cargarDashboard() {
      try {
        const d = await apiFetch("/dashboard");
        const cards = [
          { titulo: "Productos registrados", valor: d.total_productos, clase: "bg-vino" },
          { titulo: "Ventas de hoy", valor: d.ventas_hoy, clase: "bg-dorado" },
          { titulo: "Ingresos de hoy", valor: money(d.ingresos_hoy), clase: "bg-verde" },
          { titulo: "Ganancia de hoy", valor: money(d.ganancia_hoy), clase: "bg-verde" },
          { titulo: "Valor del inventario", valor: money(d.valor_inventario), clase: "bg-vino" },
          { titulo: "Productos con stock bajo", valor: d.productos_stock_bajo, clase: "bg-rojo" },
        ];
        document.getElementById("dashboard-cards").innerHTML = cards.map(c => `
          <div class="col-md-4 col-lg-2">
            <div class="card-metric ${c.clase}">
              <h6>${c.titulo}</h6>
              <div class="valor">${c.valor}</div>
            </div>
          </div>`).join("");

        document.getElementById("tabla-stock-bajo").innerHTML = d.detalle_stock_bajo.length
          ? d.detalle_stock_bajo.map(p => `
              <tr>
                <td>${p.Nombre}</td>
                <td><span class="badge badge-stock-bajo">${p.Stock_Actual}</span></td>
                <td>${p.Stock_Minimo}</td>
              </tr>`).join("")
          : `<tr><td colspan="3" class="text-muted">No hay productos con stock bajo</td></tr>`;
      } catch (e) {
        mostrarToast("Error al cargar el dashboard: " + e.message, "error");
      }
    }
</script>
</body>
</html>
